# ============================================================================
# UNVERIFIED SEED LIST
#
# These board tokens are starting guesses, not confirmed facts. Tokens change
# when a company renames, migrates ATS, or restructures its careers page, and
# a stale token returns 404 (or an empty board) forever without telling you.
#
#   RUN THIS FIRST:   python -m job_poller verify --prune
#
# It hits every token, reports which are live and how many postings each
# returned, and deactivates the dead ones. Expect a meaningful fraction of
# this list to be wrong on day one. That is normal, and it is why the verify
# command exists.
#
# TO ADD A COMPANY:
#   1. Open its careers page and click into any single job posting.
#   2. Read the address bar:
#        job-boards.greenhouse.io/SLUG  ->  ats: greenhouse
#        jobs.lever.co/SLUG             ->  ats: lever
#        jobs.ashbyhq.com/SLUG          ->  ats: ashby
#      Ashby tokens are CASE SENSITIVE. "Linear" is not "linear".
#   3. If the careers page is Workday, Taleo, SuccessFactors or bespoke, this
#      tool cannot read it. Skip it. (Shopify and most banks are Workday.)
#
# Tags are free-form and used for filtering: `--tag canada`, `--tag fintech`.
# ============================================================================

companies:
