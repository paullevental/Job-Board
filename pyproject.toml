[project]
name = "job_poller"
version = "0.1.0"
description = "Watch company ATS boards for new internship and co-op postings."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "SQLAlchemy>=2.0", "PyYAML>=6.0", "rich>=13.0"]

[project.scripts]
job_poller = "job_poller.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Without this, setuptools' flat-layout auto-discovery sees `config/` as a
# second top-level package and refuses to build.
[tool.setuptools.packages.find]
include = ["job_poller*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
